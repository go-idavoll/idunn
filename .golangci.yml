version: "2"

linters:
  enable:
    - errcheck      # a swallowed error in the apply path is a fail-open bug
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint     # errors must stay classifiable (Reporter taxonomy)
    - gosec
    - misspell
    - nilerr        # returning nil after a non-nil error = fail open
    - noctx
    - revive
    - unconvert
    - unparam

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank stays off: `_ = f.Close()` on a cleanup path is the explicit,
      # greppable form of "this error is deliberately dropped". Forcing a
      # //nolint on each one would hide the same decision behind a directive.
      check-blank: false
    gosec:
      excludes:
        - G304 # file paths are sanitized in core/stage; audited there, not here
    revive:
      rules:
        - name: exported
        - name: unused-parameter

  exclusions:
    rules:
      # Test-only helpers may take shortcuts production code may not.
      - path: _test\.go
        linters: [gosec, errcheck, unparam]
      # The red-team harness writes a TUF repository that is then SERVED over
      # httptest. World-readable files and directories are what a repository
      # looks like; 0600 would make the fixture unrepresentative of the thing
      # under attack. These are throwaway fixtures, never an install root.
      - path: ^test/redteam/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
