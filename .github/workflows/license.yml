name: License

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  addlicense-check:
    name: Check license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Install addlicense
        run: go install github.com/google/addlicense@latest

      # Kept identical to `make license` so a green local run means a green CI run.
      - name: Check headers
        run: make license
