name: Release provenance

# Build provenance for a release (IDN-18): a signed statement of which
# workflow, at which commit, produced these exact bytes. It complements TUF
# rather than replacing it -- TUF says the publisher vouches for a release,
# provenance says where the release came from (docs/design.md §15).
#
# Runs on version tags only. A tag is the only thing this repository releases,
# and attesting every commit nobody ships would be a stream of statements about
# nothing.
#
# The work is split so the OIDC token never shares a job with the build:
#
#   build   -- contents: read. The same reproducible build CI gates on
#              (scripts/repro.sh: two passes, compared), so what is attested is
#              what an independent rebuild reproduces.
#   attest  -- id-token: write and attestations: write, and nothing else. It
#              checks out nothing and runs no code from this repository; it
#              only signs the digests of the artifact the build job produced.
#
# Nothing here publishes a GitHub release or writes to the repository.
# Verify a binary with: gh attestation verify <file> --repo go-idavoll/idunn

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: stable

defaults:
  run:
    shell: bash

jobs:
  build:
    name: reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256sums: ${{ steps.digests.outputs.sha256sums }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No module or build cache: a release is built from nothing but the
      # tagged source, the module proxy (checked against go.sum) and the
      # toolchain named in go-version.txt.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false

      - name: Build twice and compare
        run: scripts/repro.sh

      - name: Publish the digests
        id: digests
        run: |
          echo "sha256sums=$(base64 -w0 dist/repro/SHA256SUMS)" >> "$GITHUB_OUTPUT"
          {
            echo "### ${GITHUB_REF_NAME} digests"
            echo
            echo '```'
            cat dist/repro/go-version.txt
            cat dist/repro/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            dist/repro/a/
            dist/repro/SHA256SUMS
            dist/repro/go-version.txt
          if-no-files-found: error

  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: release

      # The digest list comes from the build job as a job output, not out of
      # the artifact, and the downloaded binaries must match it exactly -- an
      # artifact changed between the two jobs fails here instead of being
      # attested.
      - name: Check the binaries against the build job's digests
        env:
          SHA256SUMS_B64: ${{ needs.build.outputs.sha256sums }}
        run: |
          test -n "$SHA256SUMS_B64"
          printf '%s' "$SHA256SUMS_B64" | base64 -d > "$RUNNER_TEMP/SHA256SUMS"
          cd release/a
          sha256sum --strict -c "$RUNNER_TEMP/SHA256SUMS"
          # Nothing unlisted rides along to be signed with them.
          test "$(find . -type f | wc -l)" -eq "$(wc -l < "$RUNNER_TEMP/SHA256SUMS")"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/a/*
