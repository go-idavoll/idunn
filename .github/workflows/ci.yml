name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# go.mod pins the LANGUAGE version (the oldest Go we support), not the toolchain
# CI should build with. Resolving `go-version-file: go.mod` installs exactly that
# patch release, which is by definition the oldest one and therefore carries every
# standard-library CVE fixed since — govulncheck rightly fails on it. Build with
# the current stable patch instead.
env:
  GO_VERSION: stable

# bash on all three runners, so one command line means one behaviour. PowerShell
# mangles `-coverprofile=coverage.out` into two arguments.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  # End-to-end: the real packer, installer, launcher and host application, as
  # separate processes against a served TUF repository. It runs on the same
  # three platforms as `test` because most of what it covers -- the install
  # pointer, the launcher hand-over, GC on a locked directory -- is exactly
  # where the three differ.
  e2e:
    name: end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The suite builds the binaries it drives, so the module cache has to be
      # warm before the first test starts its own `go build`.
      - name: Warm the build cache
        run: go build ./...

      - name: End-to-end
        run: go test -tags=e2e -count=1 -timeout 20m ./test/e2e/...

  # Reproducible builds are the client half of the supply-chain story. TUF says
  # the bytes you received are the bytes the publisher signed; this says the
  # bytes the publisher signed are the ones this source produces, so an
  # independent rebuild can check a release instead of trusting it
  # (docs/design.md §9, §15).
  #
  # Two passes in one job catch what actually breaks reproducibility: a
  # wall-clock stamp, an embedded absolute path, a map iterated into output.
  # They do not catch a difference between two machines -- that is what
  # publishing the digests is for.
  repro:
    name: reproducible builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build twice and compare
        run: make repro

      - name: Publish the digests
        run: |
          {
            echo '### Reproducible build digests'
            echo
            echo '```'
            cat dist/repro/a.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/repro/a
          retention-days: 7

  # Mutation testing asks the question coverage cannot: not "did this line run?"
  # but "would the suite notice if it were wrong?". It gates on thresholds set
  # below the measured scores, so it catches a regression rather than the
  # weather; the numbers to beat are in docs/status.md and are meant to rise.
  #
  # A surviving mutant is a test-gap issue. It is never a reason to weaken an
  # assertion, and a change that raises the score by deleting a check is the
  # reward-hacking AGENTS.md §6 asks reviewers to look for.
  mutate:
    name: mutation testing (lifecycle code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

      - name: Mutate
        run: make mutate

  # Coverage is measured once, on Linux, and deliberately not by the plain
  # `go test ./...` above, which understates it badly:
  #
  #   * The adversarial corpus sits behind `//go:build redteam`, so an untagged
  #     run never compiles it -- yet it is the test that exercises most of the
  #     trust and stage paths end to end.
  #   * Without -coverpkg, Go credits a package only for statements it covers in
  #     itself. The corpus is an integration test, so its reach through trust,
  #     stage and safepath would be attributed to nothing.
  #   * ./... as the coverage universe counts cmd/ and the harness tooling,
  #     which are build plumbing and will never carry tests.
  #
  # The end-to-end suite is deliberately NOT added here. It drives the real
  # binaries as child processes, and a coverage profile only records the process
  # that carries the instrumentation -- so tagging it in would double this job's
  # runtime and credit nothing. Its job is the `e2e` one above.
  #
  # Scoping to ./core/... and ./internal/... measures the lifecycle code the
  # README sets a 100% goal for -- 72% at the time of writing, against the 17%
  # the untagged run reported.
  coverage:
    name: coverage (lifecycle code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The corpus resolves against a freshly built fixture repository.
      - name: Baseline (test-only keys)
        run: make baseline

      - name: Test with coverage
        run: |
          go test -tags redteam -covermode=atomic \
            -coverpkg=./core/...,./internal/... \
            -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  # Renders the total coverage into the README badge. Split out from `test` so
  # the write permission is scoped to this job alone, and gated on pushes to
  # main so a pull request can never mutate the branch.
  badge:
    name: coverage badge
    needs: [test, e2e, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Rewrite badge and commit
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          if   awk "BEGIN{exit !($pct >= 90)}"; then color=brightgreen
          elif awk "BEGIN{exit !($pct >= 75)}"; then color=green
          elif awk "BEGIN{exit !($pct >= 60)}"; then color=yellowgreen
          elif awk "BEGIN{exit !($pct >= 40)}"; then color=orange
          else color=red
          fi
          sed -i -E \
            "s|coverage-([0-9.]+%25\|unknown)-[a-z]+\.svg|coverage-${pct}%25-${color}.svg|" \
            README.md
          if git diff --quiet -- README.md; then
            echo "Badge already at ${pct}%."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "ci: update coverage badge to ${pct}% [skip ci]"
          git push

  # Build provenance: a signed statement of which workflow, at which commit,
  # produced these exact bytes. It complements TUF rather than replacing it --
  # TUF says the publisher vouches for a release, provenance says where the
  # release came from, and an auditor wants both (docs/design.md §15).
  #
  # Tags only. Attestation needs id-token: write, which a pull request from a
  # fork does not get and should not; running it on every push would produce a
  # stream of attestations for commits nobody releases.
  provenance:
    name: build provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [test, e2e, repro]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The same build the repro job proved deterministic, so what is attested
      # is what an independent rebuild can reproduce.
      - name: Build
        run: make repro

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/repro/a/*

  static:
    name: gofmt + tidy + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Installed from source rather than via the action: the action's pinned
      # binary is built with an older Go than go.mod targets, which makes it
      # refuse the config outright ("Go language version used to build
      # golangci-lint is lower than the targeted Go version").
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
