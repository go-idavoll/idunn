name: Red team

# The adversarial corpus and the fuzzers are the project's real bug-finders
# (AGENTS.md §7). Every tampered TUF repository must be REJECTED; a mutation that
# is accepted is the highest-priority bug class in the project.
#
#
# The corpus job gates every PR. The fuzz job runs nightly and on demand: fuzzing
# is time-boxed, so a green 120s run is evidence, not proof, and gating merges on
# it would mostly buy flaky latency.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  corpus:
    name: adversarial corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Builds TEST-ONLY keys and the known-good baseline repo that every
      # mutation derives from. No production key ever enters this job.
      - name: Baseline (test-only keys)
        run: make baseline

      - name: Corpus must reject every mutation
        run: make redteam-corpus

  fuzz:
    name: fuzzers
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz parsers and path sanitizer
        run: make redteam-fuzz
        env:
          REDTEAM_FUZZTIME: 120s

      # A crasher is evidence; keep it so the case can be promoted into the
      # permanent corpus (AGENTS.md §7, "ratchet, don't forget").
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            **/testdata/fuzz/**
            ~/.cache/go-build/fuzz/**
          if-no-files-found: ignore
