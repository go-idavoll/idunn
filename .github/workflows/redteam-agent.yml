name: Red team (agent)

# OPT-IN, never a merge gate (AGENTS.md §7). A sandboxed LLM attacker only
# GENERATES candidate attacks; the deterministic runner is the oracle and a human
# triages every promotion into the permanent corpus.
#
# Sandbox constraints enforced here: test-only keys, no repository write token, no
# secrets beyond the model API key, output confined to corpus/_proposed/.

# TODO(agent): add the weekly `schedule:` trigger once test/redteam/agent/ exists.
# Scheduling it before then would only produce a weekly red run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    name: propose candidate attacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Baseline (test-only keys)
        run: make baseline

      - name: Generate and evaluate candidates
        run: make redteam-agent

      # Candidates are data, not commits. A human reviews them and promotes the
      # interesting ones into corpus/<class>/ by hand.
      - name: Upload proposed candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-proposed
          path: test/redteam/corpus/_proposed/
          if-no-files-found: ignore
