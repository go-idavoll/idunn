# Real-world update test: publish real packages as GitHub release assets, install
# from github.com, publish a newer release, and let the installed app update
# itself headlessly (test/e2e/run.sh).
#
# The releases live in a separate sandbox repository so this one never carries
# test tags — a SemVer tag here would be read by the Go module proxy as a
# version of idunn. E2E_RELEASE_TOKEN is a fine-grained token with Contents
# read/write on that repository only.
#
# Each OS job owns its own release and its own throwaway keys: nothing crosses
# jobs, and a failed job leaves its release in place for inspection.
name: E2E update

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-update
  cancel-in-progress: false

env:
  GO_VERSION: stable
  E2E_REPO: go-idavoll/idunn-e2e

defaults:
  run:
    shell: bash

jobs:
  update:
    name: update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Publish, install and update through GitHub releases
        env:
          GH_TOKEN: ${{ secrets.E2E_RELEASE_TOKEN }}
          E2E_TAG: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret E2E_RELEASE_TOKEN is not set"
            exit 1
          fi
          test/e2e/run.sh

      - name: Leave a pointer to the release
        if: failure()
        env:
          E2E_TAG: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}
        run: |
          echo "::notice::release kept for inspection: https://github.com/$E2E_REPO/releases/tag/$E2E_TAG"
