description: "an older, still validly signed repository is replayed to a client that has seen a newer one"
class: rollback
expect: reject
error_class: verify
history: rollback
mutator: advanced_metadata_versions
notes: >
  The mutator describes the honest FIRST phase, not the attack: it publishes the
  repository at role version 5 so that serving version 1 afterwards is a
  rollback rather than a first contact. Nothing in the replayed repository is
  forged, which is the point — the defence is the version the client remembers.
