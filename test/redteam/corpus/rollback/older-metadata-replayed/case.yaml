description: "an older, still validly signed repository is replayed to a client that already trusts a newer one"
class: rollback
expect: reject
error_class: verify
history: rollback
notes: >-
  The client first trusts a repository at role version 5; the same URL then
  serves the baseline at version 1. Nothing in the replay is forged or expired —
  it is exactly what the publisher once signed — so the defence can only be the
  version the client remembers. The case proves that rather than asserting it: a
  client with no cache resolves the replay successfully, and the client with a
  past refuses it without overwriting the timestamp it trusts.
