description: "a pointer names a descriptor path that is not the one for its version"
class: resolve
expect: reject
error_class: resolve
mutator: pointer_foreign_descriptor
notes: >-
  A pointer may not fetch a release it is not entitled to name. The client
  derives the expected descriptor path from the version the pointer claims and
  checks it before fetching, so a pointer aimed at another release is refused
  without a request being made for it.
