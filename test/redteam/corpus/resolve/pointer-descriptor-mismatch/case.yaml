description: "the channel pointer and the descriptor it names disagree about the version"
class: resolve
expect: reject
error_class: resolve
mutator: pointer_descriptor_mismatch
notes: >-
  Both documents are properly signed targets, so no signature check can catch
  this: TUF has nothing to say about whether two authentic documents describe
  the same release. Only the app-level comparison in LatestRelease can, and it
  refuses rather than picking a winner.
