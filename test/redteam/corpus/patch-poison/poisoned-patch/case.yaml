class: patch-poison
description: >
  A properly signed delta patch that reconstructs bytes of the attacker's
  choosing instead of the payload it is published for.
expect: no-effect
mutator: patch_poison
notes: >
  This is T21, and the reason delta stage 2 needs no trust handling of its own.
  The patch is authentic: the repository signed it, TUF accepts it, and the
  client applies it. What the client does not do is believe the result — it is
  checked against the signed hash of the payload it was supposed to rebuild, and
  a mismatch means the full target is fetched instead. The attack costs the
  client bandwidth and nothing else.

  The poisoned payload is the real one with a marker written into it, so that the
  patch producing it stays small enough for the client to prefer over the full
  download. A patch the client would skip on cost alone would make the case pass
  without ever exercising the defence.
