class: patch-poison
description: >
  The published patch bytes disagree with the signed target metadata.
expect: no-effect
mutator: patch_tampered_after_signing
notes: >
  Unlike the other two, this one never reaches the patch reader: go-tuf refuses
  the target before its bytes are handed over. It is here because the client must
  answer that refusal by fetching the full payload rather than by failing the
  update — a repository that corrupts a patch must not be able to stop an update
  it is otherwise serving honestly.
