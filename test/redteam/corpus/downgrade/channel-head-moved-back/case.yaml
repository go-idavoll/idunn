description: "the channel head names a release older than the one installed, with all metadata current"
class: downgrade
expect: reject
error_class: downgrade
history: downgrade
notes: >
  Role versions rise while the release goes backwards, so TUF has no reason to
  object: every document is authentic, signed and fresh. Only the app-level
  version floor (§14.6, T19) stands between the client and an older release, and
  the case proves that by first showing a client with no installation accepts
  the very same repository.
