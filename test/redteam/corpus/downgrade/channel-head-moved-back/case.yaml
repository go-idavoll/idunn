description: "the channel head names a release older than the one installed, with every document current"
class: downgrade
expect: reject
error_class: policy
history: downgrade
notes: >-
  A machine installed on 1.2.0 runs its updater against a repository whose role
  versions have all risen while its channel pointer now names 1.1.0. Every
  document is authentic, signed and fresh, so TUF has no reason to object; only
  the updater's downgrade policy (Policy.AllowDowngrade = false, T3) stands between the machine and an
  older release. The case proves that by first installing the very same
  repository on a machine with nothing installed.
