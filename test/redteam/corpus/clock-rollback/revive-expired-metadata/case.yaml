description: "the local clock is turned back to bring expired metadata back inside its window"
class: clock-rollback
expect: reject
error_class: clock
clock: rollback
notes: >-
  The repository here is the honest baseline: nothing is tampered with except the
  machine. TUF judges expiry against the local clock, so an attacker who can move
  that clock can revive metadata that has expired and freeze the client on it —
  the freeze defence, re-opened from below. The case proves the point rather than
  asserting it: step three resolves the same repository at the same rolled-back
  clock with a bare trust client and it succeeds, so the refusal in step four is
  the known-good time floor and nothing else.
