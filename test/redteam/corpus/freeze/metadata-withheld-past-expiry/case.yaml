description: "the server stops publishing and pins the client to the last state it saw"
class: freeze
expect: reject
error_class: verify
history: freeze
notes: >
  No mutator: the repository is honest and simply never updated. The attacker's
  whole power is to withhold — to keep a client from ever learning about a fixed
  release — and expiry is what bounds how long that works. The case also checks
  that a freshly published repository IS accepted at the same clock, so the
  refusal cannot be the clock in disguise.
