# Mutation testing gate (IDN-16), read by `make mutate` via --config.
#
# The thresholds live here and NOT on the command line on purpose: gremlins
# v0.6.0 binds --threshold-efficacy / --threshold-mcover as float flags that
# viper hands back as strings, so on the command line they are silently not
# enforced -- a run far below them still exits 0. Values read from this file
# are numbers and do gate (exit 10 / 11). Re-check that with a deliberately
# unreachable threshold whenever GREMLINS_VERSION changes.
#
# The thresholds sit below every score in docs/status.md#mutation-score, so the
# gate catches a regression rather than the weather. Raise them as gaps close;
# never lower them to make a run pass (AGENTS.md §5, §6).
unleash:
  # gremlins derives a per-mutant test timeout from the baseline run; its
  # default is too tight for suites that do filesystem work and reports every
  # mutant TIMED OUT and every score 0%.
  timeout-coefficient: 20
  threshold:
    efficacy: 75
    mutant-coverage: 75
